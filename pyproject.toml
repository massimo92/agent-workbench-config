[project]
name = "agent-workbench-config"
version = "0.1.0"
description = "Shared Agent Skills and MCP config for Codex app and Claude Desktop."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "questionary>=2.1.1",
    "rich>=14.1.0",
    "tomli>=2.0.0; python_version < '3.11'",
]

[project.scripts]
agync = "agent_workbench.cli:main"
agent-workbench = "agent_workbench.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_workbench"]
